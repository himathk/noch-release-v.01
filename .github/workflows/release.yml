name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      REPO: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Read version from tag
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet publish src/Noch -c Release -r win-x64 --self-contained -o publish -p:DebugType=none -p:Version=${{ steps.v.outputs.version }} -p:NochRepo=${{ env.REPO }}
      - run: dotnet tool restore
      - name: Fetch the previous release, for small updates
        continue-on-error: true
        run: dotnet vpk download github --repoUrl ${{ env.REPO }} --token $env:GH_TOKEN --outputDir releases
      - run: dotnet vpk pack --packId Noch --packTitle Noch --packAuthors Noch --packVersion ${{ steps.v.outputs.version }} --packDir publish --mainExe Noch.exe --icon src/Noch/noch.ico --outputDir releases
      - run: dotnet vpk upload github --repoUrl ${{ env.REPO }} --token $env:GH_TOKEN --publish --releaseName "Noch ${{ steps.v.outputs.version }}" --tag ${{ github.ref_name }} --outputDir releases
